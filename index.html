<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-white">
    <!-- Join Screen -->
    <div id="joinScreen" class="fixed inset-0 flex items-center justify-center bg-white z-50">
        <div class="bg-white p-8 rounded-lg shadow-lg">
            <h1 class="text-3xl font-bold mb-6 text-center">Cursor Game</h1>
            <div class="mb-4">
                <label for="playerName" class="block text-sm font-medium text-gray-700 mb-2">Enter your name</label>
                <input type="text" id="playerName" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Your name">
            </div>
            <div class="mb-4">
                <p class="text-sm text-gray-600">Players online: <span id="playerCount">0</span></p>
            </div>
            <button id="joinButton" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 transition-colors">
                Join Game
            </button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="hidden fixed inset-0">
        <div class="absolute top-4 left-4 bg-white/80 p-4 rounded-lg shadow-lg">
            <p class="text-lg font-semibold">Time: <span id="timer">3:00</span></p>
            <p class="text-sm text-gray-600">Players: <span id="gamePlayerCount">0</span></p>
        </div>
        <div id="gameArea" class="w-full h-full"></div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
